<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;
  background:radial-gradient(circle at top,#1b1b1b,#000);
  color:#fff;
  font-family:'Poppins',sans-serif;
}

.main{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.word{
  font-family:'Playfair Display',serif;
  font-size:clamp(26px,6vw,42px);
  opacity:0;
  transform:scale(0.3);
  animation:zoom 1s forwards;
}

@keyframes zoom{
  to{opacity:1;transform:scale(1)}
}

#fullSentence{
  display:none;
  font-family:'Playfair Display',serif;
  font-size:clamp(18px,4.5vw,24px);
  margin-top:20px;
  padding:0 10px;
}

.buttons{
  display:none;
  margin-top:25px;
  position:relative;
  width:100%;
  height:120px;
  max-width:360px;
}

button{
  min-width:140px;
  min-height:52px;
  font-size:18px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  position:absolute;
}

#yesBtn{
  background:#ff4d6d;
  color:#fff;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
}

#noBtn{
  background:#444;
  color:#fff;
  left:10%;
  bottom:0;
}

#finalLove{
  display:none;
  font-family:'Playfair Display',serif;
  font-size:clamp(42px,10vw,90px);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.08)}
}

.heart{
  position:fixed;
  font-size:24px;
  animation:float 2s linear forwards;
}
@keyframes float{
  to{transform:translateY(-140px);opacity:0}
}

.shake{animation:shake 0.4s}
@keyframes shake{
  25%{transform:translate(6px)}
  50%{transform:translate(-6px)}
}

.shapes{
  position:fixed;
  bottom:25px;
  display:flex;
  gap:35px;
}
.circle{width:30px;height:30px;border-radius:50%;background:#ff4d6d}
.triangle{
  width:0;height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:32px solid #ff4d6d;
}
</style>
</head>

<body>

<div class="main">
  <div id="wordBox"></div>

  <div id="fullSentence">
    Sen Ben İkimiz – 30.12.2025 – Saat 17.30 – Coffee LAB – Polatlı
  </div>

  <div class="buttons" id="buttons">
    <button id="yesBtn" onclick="yesClick()">Evet</button>
    <button id="noBtn" onclick="noClick()">Hayır</button>
  </div>

  <div id="finalLove">Seni Seviyorum ❤️</div>
</div>

<div class="shapes">
  <div class="triangle"></div>
  <div class="circle"></div>
</div>

<audio id="music" src="https://files.catbox.moe/5o8y0j.mp3"></audio>

<script>
const words=["Sen","Ben","İkimiz","30.12.2025","Saat 17.30","Coffee LAB","Polatlı"];
const wordBox=document.getElementById("wordBox");
const buttons=document.getElementById("buttons");
const fullSentence=document.getElementById("fullSentence");
const music=document.getElementById("music");

let i=0;

function showWords(){
  if(i>=words.length){
    fullSentence.style.display="block";
    buttons.style.display="block";
    return;
  }
  wordBox.innerHTML=`<div class="word">${words[i]}</div>`;
  i++;
  setTimeout(showWords,1400);
}
showWords();

// Müzik
document.body.addEventListener("click",()=>{
  if(music.paused){music.volume=0.6;music.play();}
},{once:true});

// Hayır kaçma
function noClick(){
  const btn=document.getElementById("noBtn");
  const area=document.querySelector(".buttons");
  const maxX=area.clientWidth-btn.offsetWidth;
  const maxY=area.clientHeight-btn.offsetHeight;
  btn.style.left=Math.random()*maxX+"px";
  btn.style.bottom=Math.random()*maxY+"px";
}

// Evet
function yesClick(){
  document.body.classList.add("shake");
  for(let j=0;j<25;j++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="❤️";
    h.style.left=Math.random()*innerWidth+"px";
    h.style.top=innerHeight+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }

  document.querySelector(".main").innerHTML="";
  document.getElementById("finalLove").style.display="block";

  setTimeout(()=>{
    location.href="https://wa.me/905075775145?text=Seni%20Seviyorum";
  },3000);
}
</script>

</body>
</html>
